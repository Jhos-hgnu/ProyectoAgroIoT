spring.application.name=api

# Si existe backend/.env (copiado de .env.example), sus variables se cargan como propiedades.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# --- Base de datos (local: docker compose; producción: Neon) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Neon gratuito tiene pocas conexiones: pool pequeño.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# --- JPA: Hibernate solo valida contra db/schema.sql, nunca crea tablas ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- AgroIoT ---
agroiot.device-api-key=${DEVICE_API_KEY:}
agroiot.cors-origins=${CORS_ORIGINS:http://localhost:5173}
